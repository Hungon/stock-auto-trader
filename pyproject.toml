[project]
name = "stock-auto-trader"
version = "0.1.0"
description = "Alpaca-powered stock auto-trader with SMA crossover strategy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.39.0",
    "fastapi>=0.115.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "uvicorn>=0.32.0",
    "yfinance>=0.2.40",
]

[project.scripts]
stock-trader = "stock_auto_trader.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_auto_trader"]
